name: Validate Prospect Intelligence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Check Website Intelligence migration
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/010_add_website_intelligence.sql
          grep -q 'create table if not exists public.website_audits' supabase/migrations/010_add_website_intelligence.sql
          grep -q 'create table if not exists public.website_audit_pages' supabase/migrations/010_add_website_intelligence.sql
          grep -q 'website_health_score' supabase/migrations/010_add_website_intelligence.sql

      - name: Check Agent 2 Website Intelligence facade
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'prospect-enrichment-resilient' agents/prospect-enrichment.js
          grep -q 'prospect-enrichment-with-audit' agents/prospect-enrichment-resilient.js
          grep -q 'website-intelligence-v1' lib/website-audit-runtime.js
          grep -q 'Website Intelligence diagnostic' agents/prospect-enrichment-with-audit.js

      - name: Check qualification partial-state behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"PARTIAL"' lib/qualification-pipeline.js
          grep -q 'CONTACT_FAILED' lib/qualification-pipeline.js
          grep -q 'OUTREACH_FAILED' lib/qualification-pipeline.js
          grep -q 'ENRICHMENT_FAILED' lib/qualification-pipeline.js
